<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/css/styles.css" />
    <title>Ingreso</title>
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <div class="brand">
        <img data-logo class="brand-logo hidden" alt="Logo" />
        <div class="brand-mark">MP</div>
        <div>
          <h1 data-event-name>Cargando…</h1>
          <p class="muted small">Panel de recaudación</p>
        </div>
      </div>

      <form id="login-form">
        <label>
          Email
          <input id="email" type="email" autocomplete="username" required />
        </label>
        <label>
          Contraseña
          <input id="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="btn primary" type="submit" id="submit-btn" style="width: 100%">Ingresar</button>
        <p class="error" id="error"></p>
        <p class="recover-link"><a href="#" id="forgot-link" class="small">¿Olvidaste tu contraseña?</a></p>
      </form>

      <form id="recover-form" class="hidden">
        <p class="hint" style="margin-top: 0">
          Ingresá tu email y te enviaremos un enlace para restablecer la contraseña.
        </p>
        <label>
          Email
          <input id="recover-email" type="email" autocomplete="username" required />
        </label>
        <button class="btn primary" type="submit" id="recover-btn" style="width: 100%">Enviar enlace</button>
        <p class="error" id="recover-error"></p>
        <p class="recover-link"><a href="#" id="recover-cancel" class="small">Volver al ingreso</a></p>
      </form>
    </main>

    <footer class="page-footer"><span data-footer></span></footer>

    <script type="module" src="/js/login.js"></script>
  </body>
</html>
